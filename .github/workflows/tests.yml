name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: customer-churn-insight-app/requirements.txt
      - run: pip install -r customer-churn-insight-app/requirements.txt pytest
      - run: pytest -q
        working-directory: customer-churn-insight-app
